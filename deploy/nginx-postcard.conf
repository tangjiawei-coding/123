# 明信片工作室 —— 阿里云 ECS nginx 站点配置
# 由 deploy/setup-server.sh 安装到 /etc/nginx/sites-available/postcard
server {
    listen 80 default_server;
    server_name _;

    # 照片上传上限（Node 端限制 25MB，这里略放宽）
    client_max_body_size 30m;

    # APK 下载落地页
    root /var/www/postcard-download;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # APK 安装包下载（强制作为附件下载）
    location = /postcard.apk {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="postcard.apk"';
    }

    # 后端 API（Android App 与网页版共用 Node 服务）
    # 生成任务含重试最长约 4 分钟，超时放宽到 10 分钟
    location /api/ {
        proxy_pass http://127.0.0.1:5123;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 社区/作品图片资源
    location /community_img/ {
        proxy_pass http://127.0.0.1:5123;
        proxy_set_header Host $host;
    }

    # 网页版入口（http://<IP>/studio/）
    location /studio/ {
        proxy_pass http://127.0.0.1:5123/;
        proxy_set_header Host $host;
    }
}
