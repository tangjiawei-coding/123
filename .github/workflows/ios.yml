name: Apple
on:
  push:
    branches: [feat/ios-app]
    paths: ['ios-app/**', '.github/workflows/ios.yml', 'postcard-studio/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iphone-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned iPhone IPA
        run: bash ios-app/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Yizhang-iPhone-IPA
          path: ios-app/release/Yizhang-iPhone-unsigned.ipa
          if-no-files-found: error
  simulator-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check shared backend
        run: |
          mkdir -p ios-app/build
          xcrun swiftc ios-app/Yizhang.swiftpm/Sources/Models.swift ios-app/Yizhang.swiftpm/Sources/API.swift ios-app/Yizhang.swiftpm/Sources/LocalStore.swift ios-app/check-native.swift -o ios-app/build/check-native
          YIZHANG_NATIVE_CHECK="$PWD/ios-app/build/check-native" node ios-app/check-backend.cjs
      - name: Build iPhone and iPad app
        run: bash ios-app/build-on-mac.sh
      - name: Inspect Playgrounds manifest support
        run: |
          find "$(xcode-select -p)/.." -name '*AppleProductTypes*' -print
          module=$(find "$(xcode-select -p)/.." -name 'AppleProductTypes.swiftmodule' -print -quit)
          test -n "$module"
          xcrun swiftc -typecheck -I "$(dirname "$module")" -package-description-version 5.9.0 ios-app/Yizhang.swiftpm/Package.swift
      - name: Launch on iPhone Simulator
        run: bash ios-app/check-simulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Yizhang-iPhone-Screenshot
          path: ios-app/build/screenshots/
      - uses: actions/upload-artifact@v4
        with:
          name: Yizhang-iOS-Simulator
          path: ios-app/build/Build/Products/Debug-iphonesimulator/Yizhang.app
      - uses: actions/upload-artifact@v4
        with:
          name: Yizhang-Swift-Playgrounds
          path: ios-app/Yizhang.swiftpm/
